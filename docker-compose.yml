version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - API_TOKEN=${API_TOKEN:-supersecrettoken}
    volumes:
      - ./src:/app/src
      - chroma_data:/app/data/chroma_db

volumes:
  chroma_data:
